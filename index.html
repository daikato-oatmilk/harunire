<title>はるにれの丘</title>
<meta name="description" content="東京の郊外で、小さなサンクチュアリを育てる3Dゲーム（ベータテスト版）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
:root {
  --ink: #22342C; --ink-2: #4D5F56; --ink-3: #7B8A82;
  --paper: #F4F5EF; --paper-2: #E9ECE3; --paper-3: #DCE2D6; --line: rgba(34, 52, 44, .13);
  --pine: #2E5A48; --pine-2: #3E7560; --hay: #D4A52F; --lupine: #6E62B0; --coral: #D6735A; --teal: #2F8A87; --leaf: #6BA646;
  --shadow: 0 1px 2px rgba(20, 34, 28, .12), 0 6px 18px rgba(20, 34, 28, .12);
  --r: 12px;
  --ui: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  --hand: 'Klee One', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
  --rail-w: 64px;
}
html, body { height: 100%; }
body { margin: 0; background: #DCE6E4; color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.6; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--hay); outline-offset: 2px; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
/* 会話の中の動物の名前のあとに、種類の小さな絵 */
svg.spi { width: 1.3em; height: 1.3em; vertical-align: -0.28em; margin: 0 .06em 0 .02em; fill: currentColor; stroke: none; color: var(--ink-2); display: inline-block; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; background: linear-gradient(#9CBFD9, #E8EFEA 78%); overflow: hidden; touch-action: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl3d { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 1px 8px 2px; border-radius: 999px; background: rgba(244, 245, 239, .92); color: var(--ink); font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 3px rgba(20, 34, 28, .2); transition: opacity .25s; }
.lbl3d.npc { background: rgba(46, 90, 72, .92); color: var(--paper); }
.lbl3d.wild { background: rgba(244, 245, 239, .75); font-weight: 500; }
.lbl3d .rib { color: var(--coral); margin-left: 4px; }
.heart3d { position: absolute; left: 0; top: 0; color: var(--coral); animation: heartUp 1.4s ease-out forwards; }
.heart3d svg { width: 22px; height: 22px; fill: var(--coral); stroke: none; }
@keyframes heartUp { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); } to { opacity: 0; transform: translate(-50%, -260%) scale(1.1); } }

/* ---------- HUD ----------
   景色が主役。操作はひとつの層に、状態はひとつの札にまとめる。
   落ち着いている時は「段階と日付」だけ。変化があった時だけ、資源と道のりを見せる */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hud-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; max-width: min(340px, calc(100% - 76px)); pointer-events: none; transition: opacity .3s; }
#hud-top > * { pointer-events: auto; }
.status { background: rgba(246, 247, 242, .95); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px 12px 9px; min-width: 196px; }
.st-head { all: unset; display: block; box-sizing: border-box; width: 100%; cursor: pointer; }
.st-head:focus-visible { outline: 2px solid var(--hay); outline-offset: 3px; border-radius: 6px; }
.st-head strong { display: block; font-size: 15px; line-height: 1.45; letter-spacing: .02em; color: var(--ink); }
.st-when { display: flex; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.st-when .sep::before { content: '・'; color: var(--ink-3); }
.st-when .sep:empty { display: none; }
.st-ev { margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--lupine); }
.st-more { overflow: hidden; max-height: 140px; opacity: 1; transition: max-height .5s ease, opacity .4s ease; }
.status.quiet .st-more { max-height: 0; opacity: 0; }
.st-res { display: flex; align-items: center; gap: 6px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
.st-res .lbl { font-size: 12px; color: var(--ink-3); font-weight: 700; }
.hands { display: inline-flex; gap: 3px; margin-right: 8px; }
.hands i { width: 10px; height: 10px; border-radius: 50%; background: var(--hay); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.hands i.used { background: var(--paper-3); }
.hands .inf { font-weight: 700; color: var(--hay); font-size: 14px; }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--paper-3); overflow: hidden; display: inline-block; }
.meter i { display: block; height: 100%; background: var(--leaf); border-radius: 3px; transition: width .6s; }
.meter i.low { background: var(--coral); }

#gauge-wrap { position: relative; margin-top: 7px; }
#gauge-wrap.hidden-g #gauge-body, #gauge-wrap.done #gauge-body { display: none; }
.g-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
#g-rest { margin-left: auto; color: var(--ink); font-size: 12px; }
#gauge-wrap.hidden-g #g-rest { display: none; }
#g-toggle { border: 0; background: transparent; padding: 2px; color: var(--ink-3); border-radius: 6px; display: grid; }
#g-toggle svg { width: 16px; height: 16px; }
#g-toggle:hover { color: var(--ink); background: var(--paper-2); }
#gauge { position: relative; height: 6px; border-radius: 3px; background: var(--paper-3); margin-top: 5px; overflow: hidden; }
#g-fill { position: absolute; inset: 0; display: flex; }
#g-fill span { height: 100%; flex: none; }
#g-fill span.new { transform-origin: left center; animation: gIn .9s ease-out both; }
@keyframes gIn { from { transform: scaleX(0); filter: brightness(1.35); } 60% { filter: brightness(1.2); } }
.status.bump { animation: gBump 1s ease-out; }
@keyframes gBump { 30% { box-shadow: 0 0 0 3px rgba(212, 165, 47, .4), var(--shadow); } }
#g-fill span.world { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .55) 0 3px, transparent 3px 7px) !important; }
#gauge .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--paper); opacity: .9; }
/* 支えの内訳は、札を開いた時だけ */
#g-legend { display: none; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; font-size: 12px; color: var(--ink-2); }
.status.open #g-legend { display: flex; }
#g-legend span { display: inline-flex; align-items: center; gap: 3px; }
#g-legend svg { width: 14px; height: 14px; }
#g-legend .sw { width: 14px; height: 8px; border-radius: 2px; background: var(--ink-3); display: inline-block; }
#g-legend .sw.w { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .7) 0 2px, transparent 2px 5px); }
#g-floats { position: absolute; left: 0; right: 0; top: 100%; height: 0; pointer-events: none; }
.gplus { position: absolute; right: 4px; top: -18px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 13px; animation: plusUp 1.8s ease-out forwards; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
.gplus svg { width: 15px; height: 15px; }
.gplus.world { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .35) 0 3px, transparent 3px 7px); }
@keyframes plusUp { 0% { opacity: 0; transform: translateY(18px); } 15% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }

/* 景色だけを見る（全画面） */
.zen-btn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(246, 247, 242, .9); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); padding: 0; transition: opacity .3s; }
.zen-btn:hover { color: var(--ink); background: #fff; }
.zen-exit { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; z-index: 13; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 8px 14px 8px 10px; background: rgba(20, 30, 26, .42); color: #fff; font-weight: 700; font-size: 13px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: opacity .8s; }
.zen-exit.dim { opacity: 0; }
body.zen #hud, body.zen #labels { display: none !important; }

/* メニューは、ひとつの帯に */
#rail { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; padding: 5px; background: rgba(246, 247, 242, .95); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
#rail button { position: relative; width: 58px; height: 52px; border: 0; border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--ink-2); padding: 0; }
#rail button svg { width: 22px; height: 22px; }
#rail button:hover { background: var(--paper-2); color: var(--ink); }
#rail button.on { background: #E1EAE3; color: var(--pine); }
.badge { position: absolute; top: 3px; right: 7px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; line-height: 18px; padding: 0 5px; box-sizing: border-box; text-align: center; }
.badge.dot { min-width: 9px; width: 9px; height: 9px; padding: 0; top: 8px; right: 14px; }

/* その場でできること（近くの動物など）は、静かなボタン。1日の終わりは、手が空いた時だけ強く */
#prompt { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); transition: opacity .3s; }
#prompt-btn { border: 1.5px solid var(--pine); background: rgba(250, 250, 246, .97); color: var(--pine); padding: 9px 20px; border-radius: 999px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 8px; }
#prompt-btn:hover { background: #fff; }
#prompt-btn kbd { font-family: var(--ui); font-size: 11px; background: var(--paper-2); border-radius: 4px; padding: 0 6px; color: var(--ink-2); }
#bottom-right { position: absolute; right: calc(var(--rail-w) + 30px); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; gap: 8px; transition: opacity .3s; }
#end-day:not(.ready) { background: rgba(250, 250, 246, .92); color: var(--ink-2); border-color: var(--line); }
#end-day:not(.ready):hover { background: #fff; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 9px 18px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; justify-content: center; color: var(--ink); }
.btn:hover { background: #fff; }
.btn.primary { background: var(--pine); color: var(--paper); border-color: var(--pine); }
.btn.primary:hover { background: var(--pine-2); }
.btn.small { padding: 6px 13px; font-size: 13px; box-shadow: none; }
.btn.ghost { box-shadow: none; background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#hint { position: absolute; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); max-width: 300px; font-size: 13px; line-height: 1.55; color: var(--ink-2); background: rgba(246, 247, 242, .9); border-radius: 10px; padding: 7px 12px; transition: opacity 1s; }
#hint:empty { display: none; }
/* 知らせは、ひとつずつ。読める長さだけ出して、日記に残る */
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); width: min(400px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 7; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: rgba(251, 251, 247, .98); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; box-shadow: 0 6px 22px rgba(20, 34, 28, .16); font-size: 14px; line-height: 1.6; color: var(--ink); animation: toastIn .35s ease-out; }
.toast > span { flex: 1; min-width: 0; }
.toast.out { animation: toastOut .4s ease-in forwards; }
.toast svg { width: 18px; height: 18px; margin-top: 2px; }
.toast button { margin-left: 4px; flex: none; border: 0; background: var(--paper-2); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; color: var(--pine); }
.toast .more { display: block; font-size: 12px; color: var(--ink-3); margin-top: 1px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }
/* パネルを開いている間は、景色の上の札とボタンを下げる（パネルと競わない） */
body.sheet-open #hud-top, body.sheet-open #zen-btn, body.sheet-open #bottom-right, body.sheet-open #prompt, body.sheet-open #hint { opacity: 0; pointer-events: none; }
#place-bar { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 150px); transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 6px 6px 18px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); font-weight: 700; max-width: calc(100% - 32px); }
#place-bar .btn { box-shadow: none; }
#banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); background: var(--paper); border-radius: 18px; padding: 18px 28px 20px; box-shadow: 0 10px 40px rgba(20, 34, 28, .28); text-align: center; min-width: 260px; max-width: calc(100% - 40px); animation: bannerIn .5s ease-out; pointer-events: none; }
#banner .eyebrow { display: block; }
#banner h3 { margin: 4px 0 2px; font-size: 22px; text-wrap: balance; }
#banner p { margin: 0; color: var(--ink-2); font-size: 13px; }
#banner .sw { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12px; padding: 1px 10px; border-radius: 999px; color: #fff; margin-top: 6px; }
#banner .sw svg { width: 14px; height: 14px; }
@keyframes bannerIn { from { opacity: 0; transform: translate(-50%, -40%); } }

/* ---------- パネル ---------- */
#sheet { position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: min(420px, calc(100% - var(--rail-w) - 56px)); background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 40px rgba(20, 34, 28, .22); display: flex; flex-direction: column; overflow: hidden; z-index: 5; animation: sheetIn .25s ease-out; }
@keyframes sheetIn { from { opacity: .35; transform: translateX(-8px); } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 17px; flex: 1; text-wrap: balance; }
.icon-btn { border: 0; background: transparent; border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.icon-btn.light { color: #fff; }
.icon-btn.light:hover { background: rgba(255, 255, 255, .15); color: #fff; }
#sheet-body { overflow-y: auto; padding: 14px 18px 22px; flex: 1; overscroll-behavior: contain; }
.sec { margin-top: 16px; }
.sec:first-child { margin-top: 0; }
.sec h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; }
.muted { color: var(--ink-3); font-size: 12px; }
.lead-s { margin: 0 0 10px; color: var(--ink-2); font-size: 13px; }
.tabs { display: flex; gap: 4px; background: var(--paper-2); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
.tabs button { flex: 1 1 auto; border: 0; background: transparent; border-radius: 999px; padding: 6px 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.tabs button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

.act { box-sizing: border-box; display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: #FBFBF8; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.act:hover:not(:disabled) { background: #fff; border-color: rgba(34, 52, 44, .25); }
.act:disabled { opacity: .55; cursor: not-allowed; }
.act .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.act .ic svg { width: 19px; height: 19px; }
.act .tx { flex: 1; min-width: 0; }
.act .tx strong { display: block; font-size: 14px; line-height: 1.4; }
.act .tx span { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.45; }
.act .cost { flex: none; text-align: right; font-size: 11px; color: var(--ink-2); line-height: 1.5; font-weight: 700; }
.act .cost em { font-style: normal; display: block; color: var(--ink-3); font-weight: 500; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); line-height: 18px; }
.pill.warn { background: #F7E4DD; color: #A4462E; }
.pill.ok { background: #E4EFDC; color: #3E6B2E; }
.pill.q { background: #E7EEF3; color: #3F6484; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--paper-2); border-radius: 10px; padding: 8px 10px; }
.stat .k { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.stat .v { font-size: 13px; font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--paper-3); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--leaf); }
.cap-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.cap { display: flex; gap: 8px; align-items: center; background: var(--paper-2); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
.cap strong { font-size: 13px; }
.cap .bar { flex: 1; }
.cap .bar i.hi { background: var(--coral); }

.alist { display: grid; gap: 6px; }
.arow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: #FBFBF8; border-radius: 12px; padding: 8px 10px; text-align: left; width: 100%; }
.arow:hover { background: #fff; }
.arow .av { width: 40px; height: 40px; border-radius: 9px; flex: none; background: #FBF7EC center / cover no-repeat; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .08); transform: rotate(-2deg); }
.arow .nm { font-family: var(--hand); font-size: 17px; font-weight: 600; }
.arow .meta { font-size: 11px; color: var(--ink-3); }
.arow .tags2 { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.hearts { display: inline-flex; gap: 1px; }
.hearts svg { width: 12px; height: 12px; stroke: var(--coral); }
.hearts svg.f { fill: var(--coral); }

.req { border: 1px solid #E3C9BE; background: #FCF6F2; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.req p { margin: 0 0 8px; font-size: 13px; }
.checks { list-style: none; margin: 8px 0 10px; padding: 0; display: grid; gap: 4px; }
.checks li { display: flex; gap: 8px; font-size: 12px; align-items: flex-start; }
.checks li svg { width: 16px; height: 16px; margin-top: 2px; flex: none; }
.checks li.ok svg { color: var(--leaf); }
.checks li.no svg { color: var(--coral); }
.checks li b { min-width: 6.5em; }
.checks.fund li { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; }
.checks.fund li span { grid-column: 2; color: var(--ink-3); }
.checks li button { border: 0; background: none; padding: 0; color: var(--lupine); font-size: 12px; text-decoration: underline; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* 人を増やす */
.team-card { background: var(--paper-2); border-radius: 12px; padding: 10px 12px; margin-bottom: 4px; }
.team-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.team-head .bar { flex: 1; margin: 0; }
.team-list { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: grid; gap: 3px; font-size: 12px; color: var(--ink-2); }
.team-list li { display: flex; justify-content: space-between; gap: 8px; }

/* 運営のお金 */
.money-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.money-line svg { width: 18px; height: 18px; color: var(--hay); }
.money-line b { margin-left: auto; color: #3E6B2E; }
.money-line.minus b { color: #A4462E; }
.money-line .btn { margin-left: 4px; }
.money-sum { background: var(--paper-2); border-radius: 12px; padding: 12px 14px; }
.ms-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.ms-row b { color: var(--ink); font-size: 15px; }
.money-sum .bar { height: 8px; margin: 8px 0 6px; }
.money-sum.minus .bar i { background: var(--coral); }
.ms-bal { margin: 0; font-size: 14px; }
.ms-bal b { font-size: 17px; }
.money-sum.minus .ms-bal b { color: #A4462E; }
.need-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.need-list li { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 10px; background: #FBFBF8; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.need-list b { font-size: 16px; }
.need-list small { grid-column: 1 / -1; color: var(--ink-3); font-size: 11px; }
.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
.ledger td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.ledger td.num { text-align: right; white-space: nowrap; padding-left: 10px; font-weight: 700; }
.ledger td small { display: block; font-size: 11px; color: var(--ink-3); }
.ledger tr.grp th { text-align: left; font-size: 11px; letter-spacing: .08em; color: var(--ink-3); padding: 10px 0 2px; }
.ledger tr.tot td { border-bottom: 0; font-weight: 700; padding-top: 8px; }
.ledger.small { font-size: 12px; }
details.db { margin-top: 16px; background: var(--paper-2); border-radius: 12px; padding: 8px 12px; }
details.db summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); }
details.db .muted a { color: var(--lupine); }
.checks li.warn svg { color: var(--hay); }

/* 動物カード */
.acard-head { display: flex; gap: 12px; align-items: center; }
.acard-head .av { width: 76px; height: 76px; border-radius: 10px; background: #FBF7EC center / cover no-repeat; box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0, 0, 0, .12); flex: none; transform: rotate(-2.5deg); }
.acard-head h3 { margin: 0; font-family: var(--hand); font-size: 26px; font-weight: 600; line-height: 1.2; }
.acard-head .sub { font-size: 12px; color: var(--ink-3); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 14px 0 6px; font-size: 13px; }
.facts dt { color: var(--ink-3); font-size: 12px; font-weight: 700; padding-top: 1px; }
.facts dd { margin: 0; }
.stories { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.stories li { font-family: var(--hand); font-size: 15px; line-height: 1.75; background: var(--paper-2); border-radius: 10px; padding: 8px 12px; }
.stories li.locked { font-family: var(--ui); font-size: 12px; color: var(--ink-3); background: transparent; border: 1px dashed var(--paper-3); }

/* 日記：罫線のノート */
.diary-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.diary-nav .num { font-size: 12px; color: var(--ink-3); flex: 1; text-align: center; }
.page { position: relative; background: #FCFCF7; border-radius: 6px 12px 12px 6px; box-shadow: inset 6px 0 0 #E4E6DC, 0 1px 3px rgba(0, 0, 0, .08); padding: 16px 16px 18px 52px;
  background-image: linear-gradient(to right, transparent 43px, rgba(214, 115, 90, .45) 43px, rgba(214, 115, 90, .45) 44px, transparent 44px), repeating-linear-gradient(to bottom, transparent 0 29px, rgba(110, 98, 176, .16) 29px 30px); background-position: 0 0, 0 12px; }
.page .stamp { position: absolute; right: 14px; top: 10px; transform: rotate(-7deg); border: 2px solid var(--coral); color: var(--coral); border-radius: 8px; padding: 1px 8px; font-weight: 700; font-size: 12px; background: rgba(252, 252, 247, .8); }
.page .pdate { font-family: var(--hand); font-size: 21px; font-weight: 600; line-height: 30px; margin: 0; }
.page .pmeta { font-size: 12px; color: var(--ink-3); line-height: 30px; margin: 0; }
.page .cat { margin: 0; line-height: 30px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.page .cat i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.page p.en { font-family: var(--hand); font-size: 16px; line-height: 30px; margin: 0; }
.page img { display: block; width: 100%; border-radius: 4px; margin: 6px 0 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.changes { display: grid; gap: 6px; margin: 6px 0 4px; }
.chg { display: flex; gap: 8px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.chg:hover { border-color: var(--hay); }
.chg i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chg .go { margin-left: auto; font-size: 11px; color: var(--lupine); font-weight: 700; flex: none; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.filters button { border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 2px 9px; color: var(--ink-2); }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.album { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.album figure { margin: 0; background: #fff; padding: 6px 6px 4px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }
.album img { width: 100%; display: block; }
.album figcaption { font-family: var(--hand); font-size: 12px; padding-top: 3px; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kc { text-align: left; border: 1px solid var(--line); border-top: 4px solid var(--lupine); background: #fff; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 700; min-height: 58px; }
.kc.locked { border-top-color: var(--paper-3); color: var(--ink-3); background: var(--paper-2); font-weight: 500; }

/* モーダル */
#modal { position: absolute; inset: 0; background: rgba(20, 30, 26, .35); display: grid; place-items: center; z-index: 10; padding: 16px; }
.modal-card { background: var(--paper); border-radius: 16px; box-shadow: 0 16px 50px rgba(0, 0, 0, .3); width: min(460px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 20px 22px; animation: bannerIn .25s ease-out; }
.modal-card h3 { margin: 2px 0 8px; font-size: 19px; text-wrap: balance; }
.modal-card p { margin: 0 0 10px; }
.modal-card .srcs { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; display: grid; gap: 3px; }
.modal-card .srcs a { color: var(--lupine); }
.kcard-band { margin: -20px -22px 14px; padding: 12px 22px; background: var(--lupine); color: #fff; border-radius: 16px 16px 0 0; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 12px; letter-spacing: .08em; }
.modal-card img.shot { width: 100%; max-height: 58vh; object-fit: contain; background: var(--paper-2); border-radius: 8px; display: block; margin: 4px 0 10px; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); }
.dialog-who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dialog-who .av { width: 40px; height: 40px; border-radius: 50%; flex: none; }
.dialog-who strong { font-size: 16px; }
.said { font-family: var(--hand); font-size: 17px; line-height: 1.8; background: var(--paper-2); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg button:disabled { opacity: .38; }
.field { margin-bottom: 14px; }
.field > label, .field > .flabel { display: block; font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 6px; letter-spacing: .04em; }
.field input[type=range] { width: 100%; accent-color: var(--pine); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.switch input { width: 20px; height: 20px; accent-color: var(--pine); }
.confirm { background: #FCF6F2; border: 1px solid #E3C9BE; border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 13px; }

/* 撮影モード */
#photo-ui { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
#photo-ui > * { pointer-events: auto; }
.photo-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, .45); pointer-events: none; }
#photo-frame-preview { position: absolute; inset: 0; pointer-events: none; }
.photo-dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; gap: 10px; justify-items: center; background: linear-gradient(to top, rgba(14, 22, 19, .5), rgba(14, 22, 19, 0)); pointer-events: none; }
.photo-dock > * { pointer-events: auto; }
.photo-opts { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; background: rgba(20, 30, 26, .5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 16px; padding: 6px 12px; color: #fff; max-width: 100%; }
.photo-opts .seg { background: rgba(255, 255, 255, .15); flex-wrap: nowrap; }
.photo-opts .seg button { color: #fff; }
.photo-opts .seg button.on { background: #fff; color: var(--ink); }
.photo-opts .check { font-size: 12px; font-weight: 700; display: flex; gap: 5px; align-items: center; }
.photo-opts .dof-ctl input { width: 96px; accent-color: #fff; }
.photo-bar { width: min(420px, 100%); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.photo-done { justify-self: start; border: 0; border-radius: 999px; padding: 0 20px; min-height: 46px; font: inherit; font-weight: 700; font-size: 15px; background: rgba(255, 255, 255, .94); color: var(--ink); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
.photo-last { justify-self: end; width: 54px; height: 54px; border-radius: 10px; border: 2px solid #fff; padding: 0; overflow: hidden; background: rgba(255, 255, 255, .2); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.photo-last img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-last.pop { animation: thumbPop .55s ease-out; }
@keyframes thumbPop { 0% { transform: translate(-60px, -60px) scale(.5); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }
.photo-saved { margin: 0; min-height: 18px; color: #fff; font-size: 13px; font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, .55); opacity: 0; transition: opacity .35s; pointer-events: none; }
.photo-saved.on { opacity: 1; }
.photo-tip { font-size: 12px; font-weight: 700; opacity: .92; text-align: center; padding: 0 8px; }
#focus-ring { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 2px solid rgba(255, 255, 255, .95); border-radius: 12px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); pointer-events: none; animation: focusIn .9s ease-out forwards; }
@keyframes focusIn { 0% { transform: scale(1.4); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
#photo-ui.instant #photo-frame-preview { -webkit-backdrop-filter: contrast(.93) saturate(.84) sepia(.1) brightness(1.04); backdrop-filter: contrast(.93) saturate(.84) sepia(.1) brightness(1.04); }
.shutter { width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff; background: rgba(255, 255, 255, .35); box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
.shutter:active { transform: scale(.94); background: rgba(255, 255, 255, .7); }
.shutter:hover { background: rgba(255, 255, 255, .6); }
.flash { position: absolute; inset: 0; background: #fff; animation: flash .45s ease-out forwards; pointer-events: none; z-index: 9; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }

/* 楽器 */
#music-ui { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
#music-ui > * { pointer-events: auto; }
.music-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; }
.music-top .seg { background: rgba(20, 30, 26, .55); backdrop-filter: blur(6px); }
.music-top .seg button { color: #fff; font-size: 13px; padding: 6px 14px; }
.music-top .seg button.on { background: #fff; color: var(--ink); }
.music-panel { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); background: rgba(244, 245, 239, .96); border-radius: 18px; box-shadow: 0 10px 36px rgba(20, 34, 28, .28); padding: 12px; display: grid; gap: 10px; }
#chord-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#chord-grid button { border: 1px solid var(--line); background: #fff; border-radius: 12px; height: 46px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; position: relative; touch-action: manipulation; }
#chord-grid button small { position: absolute; left: 6px; top: 3px; font-size: 10px; color: var(--ink-3); font-weight: 700; }
#chord-grid button.on { background: var(--pine); color: var(--paper); border-color: var(--pine); }
#chord-grid button.on small { color: rgba(244, 245, 239, .7); }
#string-pad { position: relative; height: 150px; border-radius: 12px; background: linear-gradient(90deg, #6B4A30, #8A6242 38%, #7A5438); overflow: hidden; touch-action: none; cursor: pointer; }
#string-pad .str { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(#F4EEDC, #B9AE92); box-shadow: 0 1px 1px rgba(0, 0, 0, .35); transition: transform .05s; }
#string-pad .str.hit { transform: scaleY(2.2); background: #FFF6D8; }
#string-pad .str.mute { opacity: .35; }
#pad-chord { position: absolute; left: 10px; top: 6px; font-size: 30px; font-weight: 700; color: rgba(255, 246, 220, .85); pointer-events: none; }
.music-hint { margin: 0; font-size: 12px; color: var(--ink-3); text-align: center; }

.music-acts { display: flex; gap: 8px; }
.music-panel.folded #string-pad, .music-panel.folded .music-hint { display: none; }

/* 座って休む */
#rest-ui { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.rest-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(20, 30, 26, .30) 100%); }
.rest-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 8px; }
#rest-ui.music .rest-top { display: none; }
.rest-btn { pointer-events: auto; border: 0; border-radius: 999px; background: rgba(244, 245, 239, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--ink); font-size: 13px; font-weight: 700; padding: 8px 16px; box-shadow: 0 1px 4px rgba(20, 34, 28, .15); }
.rest-btn.strong { background: rgba(244, 245, 239, .92); }
.rest-btn[aria-pressed="true"] { background: var(--pine); color: var(--paper); }
.rest-bottom { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.rest-cap { margin: 0; min-height: 3.4em; display: flex; align-items: flex-end; justify-content: center; font-family: var(--hand); font-size: 19px; font-weight: 600; line-height: 1.7; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .5), 0 0 2px rgba(0, 0, 0, .35); text-align: center; max-width: 28em; opacity: 0; transition: opacity 1.6s ease; text-wrap: balance; }
.rest-cap.on { opacity: 1; }
.rest-cap .in { display: block; }
.rest-cap .cseg { display: inline-block; }
.rest-meter { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
.rest-meter b { width: 120px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .32); overflow: hidden; display: block; }
.rest-meter i { display: block; height: 100%; background: #D9EDBE; transition: width 1.2s ease; }
.rest-breath { position: absolute; left: 50%; top: 40%; width: 128px; height: 128px; margin: -64px 0 0 -64px; display: grid; place-items: center; }
/* 呼吸のガイド：くっきりした線ではなく、ふちのぼやけた光の輪。正確さより、目をやすめるための目安 */
.rest-breath i { position: absolute; inset: -8px; border-radius: 50%; transform: scale(.55);
  background: radial-gradient(circle closest-side, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .14) 48%, rgba(255, 255, 255, .5) 72%, rgba(255, 255, 255, .2) 86%, rgba(255, 255, 255, 0) 100%);
  box-shadow: 0 0 30px 8px rgba(255, 255, 255, .14); filter: blur(2px); }
.rest-breath span { position: relative; font-family: var(--hand); font-weight: 600; font-size: 16px; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 8px rgba(0, 0, 0, .35); }
#veil { position: absolute; inset: 0; background: #F4F5EF; opacity: 0; transition: opacity .6s ease; z-index: 12; pointer-events: none; }
#veil.on { opacity: 1; }
@media (max-width: 720px) { .rest-cap { font-size: 17px; } }

/* 見た目 */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.av-tabs { margin: 0 0 10px; }
.av-tabs button { padding: 6px 16px; font-size: 13px; }
.faces { display: flex; gap: 6px; flex-wrap: wrap; }
.faces button { border: 0; background: var(--paper-2); border-radius: 12px; padding: 4px 4px 3px; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink-2); font-size: 10.5px; font-weight: 700; box-shadow: inset 0 0 0 1px transparent; }
.faces button img { width: 44px; height: 44px; display: block; }
.faces button.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--pine), 0 1px 3px rgba(0,0,0,.12); }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); }
.swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
#sheet.short { max-height: none; }
.sticky-foot { position: sticky; bottom: -22px; margin: 14px -18px -22px; padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 14px); background: linear-gradient(rgba(244, 245, 239, 0), var(--paper) 30%); display: flex; gap: 8px; }
@media (max-width: 720px) { #sheet.short { max-height: 52%; } }

/* はじめの画面 */
#start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 8; background: linear-gradient(to top, rgba(20, 34, 28, .28), transparent 55%); }
.start-card { margin-top: auto; flex-shrink: 0; box-sizing: border-box; background: rgba(244, 245, 239, .95); border-radius: 20px; padding: 22px 24px 18px; width: min(508px, 100%); box-shadow: 0 16px 50px rgba(20, 34, 28, .25); }
.start-card h1 { margin: 2px 0 6px; font-size: clamp(40px, 9vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: .04em; color: var(--ink); }
.start-card .lead { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; max-width: 34em; text-wrap: pretty; }
.start-actions { display: grid; gap: 8px; }
.start-btn { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 16px; display: grid; gap: 1px; }
.start-btn strong { font-size: 16px; }
.start-btn span { font-size: 12px; color: var(--ink-3); }
.start-btn.primary { background: var(--pine); color: var(--paper); border-color: var(--pine); }
.start-btn.primary span { color: rgba(244, 245, 239, .78); }
.start-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.start-confirm { margin-top: 0; }
.start-note { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); text-wrap: pretty; }
.start-file { margin: 6px 0 0; }
.start-link { background: none; border: 0; padding: 10px 0; min-height: 44px; font: inherit; font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.controls { margin: 12px 0 0; font-size: 12px; color: var(--ink-3); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: #DCE6E4; z-index: 20; font-weight: 700; color: var(--ink-2); transition: opacity .6s; }
#loading.gone { opacity: 0; pointer-events: none; }

/* スマホ */
@media (max-width: 720px) {
  :root { --rail-w: 0px; }
  #hud-top { left: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .status { padding: 7px 11px 8px; }
  #rail { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); right: 8px; left: 8px; transform: none; flex-direction: row; gap: 0; padding: 4px; border-radius: 16px; }
  #rail button { flex: 1; width: auto; height: 50px; border-radius: 11px; font-size: 10.5px; }
  #prompt { bottom: calc(env(safe-area-inset-bottom, 0px) + 122px); }
  #bottom-right { right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); }
  #end-day { padding: 8px 15px; font-size: 13.5px; }
  #hint { left: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); max-width: calc(100% - 190px); font-size: 12px; }

/* 朝の知らせ：最初に結論。遊び方は3行に */
.howto { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 8px; }
.howto li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.6; }
.howto li svg { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--pine); }
details.more { margin-top: 8px; }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-2); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: '＋'; color: var(--ink-3); }
details.more[open] summary::after { content: '−'; }
details.more p { margin: 8px 0 0; }
.calm-line { font-size: 15px; line-height: 1.75; color: var(--ink-2); margin: 0 0 12px; }
@media (max-width: 720px) {
  #sheet-body { padding: 14px 16px 24px; }
  .tabs button { font-size: 13px; padding: 7px 2px; }
}

/* 説明や問いかけ（モーダル）を開いている間も、景色の上の札は下げる */
body.modal-open #hud-top, body.modal-open #zen-btn, body.modal-open #bottom-right, body.modal-open #prompt, body.modal-open #hint { opacity: 0; pointer-events: none; }

/* 日記の絞り込み：横にはみ出さず、折り返して全部見えるように */
.filters { flex-wrap: wrap; gap: 6px; overflow: visible; margin: 0 0 12px; padding: 0; }
.filters button { flex: none; }

/* 0.9.2：今できることを先に。できないこと、大丈夫な項目はたたむ */
details.more-acts { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
details.more-acts > summary, details.checks-ok > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px 0; }
details.more-acts > summary::-webkit-details-marker, details.checks-ok > summary::-webkit-details-marker { display: none; }
details.more-acts > summary::after, details.checks-ok > summary::after { content: '＋'; color: var(--ink-3); }
details.more-acts[open] > summary::after, details.checks-ok[open] > summary::after { content: '−'; }
details.checks-ok > summary svg { width: 16px; height: 16px; color: var(--leaf); }
details.checks-ok { margin: -4px 0 8px; }
#end-day.confirming { background: var(--coral); border-color: var(--coral); color: #fff; }
.sticky-foot.btn-row { flex-wrap: wrap; }


/* 日記の表紙（今週の一枚）と、小さく並べた写真（0.9.3） */
.page .cover { position: relative; margin: 14px -2px 14px; background: #fff; padding: 8px 8px 7px; border-radius: 3px; box-shadow: 0 2px 9px rgba(20, 34, 28, .17); transform: rotate(-1.1deg); }
.page .cover::before { content: ''; position: absolute; top: -9px; left: 50%; width: 78px; height: 20px; margin-left: -39px; background: rgba(222, 205, 160, .78); transform: rotate(2.4deg); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.page .cover button, .album figure button { all: unset; display: block; width: 100%; cursor: pointer; }
.page .cover button:focus-visible, .album figure button:focus-visible { outline: 2px solid var(--hay); outline-offset: 2px; }
.page .cover img { margin: 0; border-radius: 1px; box-shadow: none; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 55%; }
.page .cover figcaption { font-family: var(--hand); font-size: 17px; font-weight: 600; line-height: 1.5; padding: 7px 2px 0; color: var(--ink); }
.page .cover figcaption small { display: block; font-family: var(--ui); font-weight: 500; font-size: 13px; color: var(--ink-3); }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 10px; }
.thumb { position: relative; border: 0; padding: 4px 4px 3px; background: #fff; border-radius: 3px; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); text-align: left; min-width: 0; }
.page .thumb img { margin: 0; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; box-shadow: none; border-radius: 1px; }
.thumb span { display: block; font-size: 12px; line-height: 1.45; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 3px; }
.thumb i { position: absolute; top: 7px; left: 7px; font-style: normal; font-size: 12px; font-weight: 700; background: rgba(46, 90, 72, .92); color: #fff; border-radius: 999px; padding: 0 8px; line-height: 20px; }
.album figcaption .cv { display: inline-block; margin-right: 4px; font-family: var(--ui); font-size: 11px; font-weight: 700; color: #fff; background: var(--pine); border-radius: 999px; padding: 0 6px; line-height: 17px; }
.photo-cap { font-family: var(--hand); font-size: 17px; font-weight: 600; margin: 0 0 10px; }
.photo-cap small { display: block; font-family: var(--ui); font-size: 13px; font-weight: 500; color: var(--ink-3); }

/* はるこさん・ゆうとさんの話（0.9.3） */
.talk-offer { margin: -2px 0 12px; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
.talk-offer small { display: block; font-size: 13px; color: var(--ink-3); }
.talk-t { margin: 4px 0 6px; font-size: 17px; }
.you { margin: 0 0 8px; padding: 0 2px; font-size: 15px; line-height: 1.7; color: var(--ink-2); text-align: right; }
.morita-card.locked { opacity: .7; }
.talk-next { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.talk-wait { margin: 0 0 10px; }
.talk-log { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 6px; }
.talk-log li { background: #FBFBF8; border: 1px solid var(--line); border-radius: 10px; padding: 0; }
.talk-log summary { list-style: none; cursor: pointer; padding: 9px 12px 9px 30px; position: relative; }
.talk-log summary::-webkit-details-marker { display: none; }
.talk-log summary::before { content: ''; position: absolute; left: 12px; top: 15px; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform .2s; }
.talk-log details[open] summary::before { transform: rotate(45deg); top: 13px; }
.talk-log .tl-n { display: block; font-size: 13px; color: var(--ink-3); }
.talk-log b { display: block; font-size: 15px; }
.talk-log .tl-end { display: block; font-family: var(--hand); font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.talk-log details[open] .tl-end { display: none; }
.talk-log .tl-body { padding: 2px 12px 10px; }
.talk-log .tl-body .said { margin-bottom: 8px; font-size: 15px; }
.ppl { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
.ppl li { display: flex; gap: 10px; align-items: flex-start; }
.ppl .av { width: 28px; height: 28px; border-radius: 50%; flex: none; margin-top: 2px; box-shadow: inset 0 0 0 1px rgba(34, 52, 44, .18); }
.ppl b { font-size: 15px; } .ppl small { font-size: 13px; color: var(--ink-3); margin-left: 6px; }
.ppl span { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.morita-card .mav { color: #fff; font-size: 17px; }

/* 会話：言葉と、あなたの返事が続く時は、少し詰める */
.said + .you { margin-top: -4px; }
.you + .said { margin-top: 0; }

/* 置く画面：手元の遊び道具の数と、置いてある数 */
.token-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 0 0 12px; border-radius: 14px; background: var(--paper-2); }
.token-card .tk-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--hay); color: #fff; flex: none; }
.token-card .tk-ic svg { width: 22px; height: 22px; }
.token-card .tk-tx { flex: 1; display: grid; gap: 1px; min-width: 0; }
.token-card .tk-tx > span { font-size: 13px; color: var(--ink-2); }
.token-card .tk-tx b { font-size: 17px; line-height: 1.2; }
.token-card .tk-tx b small { font-size: 13px; font-weight: 600; margin-left: 2px; }
.token-card .tk-tx > small { font-size: 13px; color: var(--ink-3); }
.token-card.empty { box-shadow: inset 0 0 0 1.5px var(--hay); }
.act { position: relative; }
.act .cnt { position: absolute; left: 38px; top: calc(50% - 27px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--paper); }
.act .tx .where { display: block; margin-top: 3px; font-size: 13px; color: var(--ink-2); }

/* 育ち具合：名前のあとに、5つの小さな点 */
.stg-dots { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
.stg-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .22; }
.stg-dots i.on { opacity: .75; }

/* サンクチュアリの様子：3つの見出しを横に並べると「暮らしの穏やかさ」が折り返すので、1行ずつの並びに */
.stat-row, .stat-row[class] { grid-template-columns: 1fr; gap: 6px; }
.stat { display: grid; grid-template-columns: 8.4em auto minmax(56px, 1fr); align-items: center; column-gap: 12px; padding: 8px 12px; }
.stat .k { font-size: 13px; white-space: nowrap; }
.stat .v { font-size: 15px; white-space: nowrap; }
.stat .bar { margin: 0; }

/* パネルのタブは、スクロールしても上に残す。見出しには今いるタブ */
#sheet-body { --pt: 16px; --px: 18px; }
@media (max-width: 720px) { #sheet-body { --pt: 14px; --px: 16px; } }
#sheet-body .stick { position: sticky; top: calc(-1 * var(--pt)); z-index: 6; background: var(--paper); margin: 0 calc(-1 * var(--px)) 14px; padding: 8px var(--px); transition: box-shadow .2s; }
#sheet-body .stick.top { margin-top: calc(-1 * var(--pt)); padding-top: calc(var(--pt) - 4px); }
#sheet-body .stick.stuck { box-shadow: 0 6px 10px -8px rgba(20, 34, 28, .35); }
#sheet-body .stick .tabs { margin-bottom: 0; }
.sheet-head h2 .crumb { display: inline-block; margin-left: 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--paper-2); border-radius: 999px; padding: 2px 10px; vertical-align: 2px; }

/* 飾る：行事の飾り（自動） */
.ev-auto { background: var(--paper-2); border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; }
.ev-auto h4 { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); }
.ev-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 15px; }
.ev-row small { display: block; font-size: 13px; color: var(--ink-3); }

    MATS.set(key, m);
  }
  return m;

function heightAt(x, z) {
  let h = 0.16 * Math.sin(x * 0.13 + 1.3) * Math.cos(z * 0.11 - 0.7);
  if (z < -41) { const t = Math.min(1, (-41 - z) / 9); h += 1.5 * t * t * (0.75 + 0.25 * Math.sin(x * 0.21)); }
  const e = Math.max(Math.abs(x), Math.abs(z));
  if (e > 53) h *= Math.max(0, (56 - e) / 3);
  if (WS.pond) {
    const d = Math.hypot(x - POND.x, z - POND.z);
    if (d < POND.r + 1.2) { const t = 1 - d / (POND.r + 1.2); h = h * (1 - t) - 1.05 * Math.min(1, t * 1.7); }
  }
  if (WS.stream && z < -26 && z > -46) {
    const dz = Math.abs(z - streamZ(x));
    if (dz < 2.8) { const t = 1 - dz / 2.8; h = h * (1 - Math.min(1, t * 1.4)) - 0.85 * Math.min(1, t * 1.6); }
  }
  if (WS.mud) { const d = Math.hypot(x - MUD.x, z - MUD.z); if (d < MUD.r) h -= 0.18 * (1 - d / MUD.r); }
  return h;
}

/* 紙の模様を景色につける：基準の画面（カメラの行列）を覚えておき、カメラが動き続けたら1秒ごとに重ね替える */

/* =========================================================

   ・演目は4つ（季節のうた／動物たちのパレード／星空の物語／この丘の名前）
   ・見る人の正面の、高い空に。区画や巣の上は飛ばない

function setFoliageSeason(season, snow) {
  const F = NM.foliage;
  const S = {
    spring: { elm: '#8CBB5E', birch: '#9CC468', conifer: '#34543E', maple: '#8CBB5E', sakura: '#F4C6D0', young: '#9AC468', bamboo: '#7AA24E' },
    summer: { elm: '#5E9244', birch: '#6A9A48', conifer: '#2F4E3A', maple: '#6A9A48', sakura: '#6A9A48', young: '#78AA4E', bamboo: '#6A9444' },
    autumn: { elm: '#C9A043', birch: '#B8904A', conifer: '#34543E', maple: '#C9533A', sakura: '#C8743E', young: '#B8A04A', bamboo: '#7A9A4E' },
    winter: { elm: '#A89C86', birch: '#A8865A', conifer: '#3A5A44', maple: '#A89C86', sakura: '#A89C86', young: '#9A9478', bamboo: '#6E9048' },
    snow:   { elm: '#DCDFDD', birch: '#DDE0DE', conifer: '#8AA096', maple: '#DCDFDD', sakura: '#DCDFDD', young: '#DCDFDD', bamboo: '#A9BFA6' },
  }[snow ? 'snow' : season];
  // 桜：3月末から4月の初めだけ桜色。それ以外の春は、若葉
  if (!snow && season === 'spring' && !WS.sakuraBloom) S.sakura = '#8CBB5E';
  if (!snow && season !== 'spring' && WS.sakuraBloom) S.sakura = '#F4C6D0';
  for (const k in S) F[k].color.set(S[k]);
  NM.grass.color.set(snow ? '#E8ECEC' : { spring: '#86B85A', summer: '#6A9E44', autumn: '#A6A458', winter: '#A8A070' }[season]);
  NM.tallGrass.color.set(snow ? '#E2E6E4' : { spring: '#9CBA60', summer: '#93A650', autumn: '#C4AA66', winter: '#B8A878' }[season]);
}

function bakeGroup(g) {

    geo.applyMatrix4(c.matrix);

function avDocId(cat, id) { return (cat + '-' + String(id).replace(/^#/, 'c')).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 120); }
function avRebuild() {
  const map = new Map(), idx = {};

  for (const k in AV.db) {
    const d = AV.db[k];
    if (!d || !AV_CAT[d.cat] || typeof d.id !== 'string' || !d.id) continue;
    const key = d.cat + '|' + d.id, base = map.get(key);
    map.set(key, Object.assign({}, base || { order: 900, enabled: true }, d, { builtin: !!base, changed: true, docId: k === '~preview' ? undefined : k }));

function avColorOf(cat, id) { const o = avOpt(cat, id); if (o && isHex(o.color)) return o.color; if (isHex(id)) return id; const f = avList(cat)[0]; return f ? (isHex(f.color) ? f.color : f.id) : '#888888'; }

/* ---------- 色の読み替え ---------- */

  const hx = (h, d) => (isHex(h) ? h : d);

  const dk = (h, k) => '#' + new THREE.Color(h).multiplyScalar(k).getHexString();

}
function avCol(ref, ctx) { if (isHex(ref)) return ref; return (ref && ctx[ref]) || '#888888'; }

/* ---------- 立体の部品を組み立てる ---------- */
function avParts(list, parent, ctx, out) {
  if (!Array.isArray(list)) return;
  const V = THREE.Vector3, num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const vec = (a, d) => (Array.isArray(a) ? [num(a[0], d[0]), num(a[1], d[1]), num(a[2], d[2])] : d);
  for (const q of list.slice(0, 40)) {

        const a = new V(f[0] * sx, f[1], f[2]), b = new V(t[0] * sx, t[1], t[2]), mid = a.clone().add(b).multiplyScalar(0.5), len = a.distanceTo(b), w = num(q.w, 0.04);

        st.quaternion.setFromUnitVectors(new V(0, 1, 0), b.clone().sub(a).normalize());
        continue;
      }
      if (q.s === 'skirt') {
        if (!G3.skirt) { G3.skirt = new THREE.CylinderGeometry(0.31, 0.44, 0.46, 10, 1, true); G3.skirt.scale(1, 1, 0.72); }

/* ---- 置き場所と飾り ---- */
function slotAvailable(s) { return G.stage >= s.stage && (!s.zone || G.stage >= ZONES[s.zone].stage); }
function buildPlaced(sid) {

  if (id === 'bench') ry = benchFacing(s.x, s.z);

  if (id === 'bench') W.benches.push({ sid, x: s.x, z: s.z, ry, model: m });

}
/* ベンチは、いちばん近い動物の区画のほうを向ける */
function benchFacing(x, z) {
  let best = null, bd = 1e9;
  for (const k in ZONES) {
    const zn = ZONES[k]; if (G.stage < zn.stage) continue;
    if (!G.animals.some((a) => a.zone === k)) continue;
    const r = zn.rect, cx = (r[0] + r[1]) / 2, cz = (r[2] + r[3]) / 2;
    const d = Math.hypot(clamp(x, r[0], r[1]) - x, clamp(z, r[2], r[3]) - z);
    if (d < bd) { bd = d; best = [cx, cz]; }
  }
  return best ? Math.atan2(best[0] - x, best[1] - z) : (x > 0 ? -Math.PI / 2 : Math.PI / 2);
}
function itemCircles(id, x, z, ry) {
  if (id === 'bench') { const ax = Math.cos(ry), az = -Math.sin(ry); return [[x + ax * 0.6, z + az * 0.6, 0.42], [x - ax * 0.6, z - az * 0.6, 0.42]]; }
  const R0 = { sign: 0.3, lantern: 0.25, flowerbed: 1.0, sunflower: 0.8, haybale: 0.8, pumpkin: 0.8, ppumpkin: 0.6, susuki: 0.4, ribbon: 0.2, paperorn: 0.5, sakura: 0.5, holly: 0.2, brush: 0.4, climb: 1.1, puzzle: 0.6, rope: 1.0, pool: 1.2, floatveg: 0.8, dustbath: 0.9, ball: 0.5, haynet: 0.5, music: 0.25, perch: 1.0, tunnel: 0.9 };
  return [[x, z, R0[id] || 0.6]];
}
function removePlaced(sid) {

  delete W.itemCircles[sid]; NAV.dirty = true;
  const m = W.placedModels[sid]; if (m) { W.layers.deco.remove(m); disposeTree(m); }

/* ---- くもりの日の雲：木と同じ作り（雲の絵を切り抜いた紙を3枚、十字に組んで）、空に浮かべる ---- */
const CLOUDS = { g: null, list: [], mats: {}, op: 0, dark: 0 };
const CLOUD_W = 1024, CLOUD_H = 300; // 横長の紙。形の縦横比も、これに合わせる
function cloudTexture(seed) {

    for (const p of peaks) v = Math.max(v, v * 0.4 + p.h * Math.exp(-(((t - p.x) / p.w) ** 2)));

  const inner = [];

    for (let f = 0.72; f > 0.28; f -= 0.22 + rnd() * 0.12) inner.push({ x: c0.x + (rnd() - 0.5) * 30, y: base - hp * f, r: 18 + hp * 0.14 + rnd() * 10 });

    pcClump(g, rnd, c0.x, c0.top + c0.r * 0.95, c0.r, C.base, C.hi, C.lo, null);

  }
  // てっぺんの小さなこぶ

  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillRect(0, base + 2, W, H); g.restore();

  return pcTexture(c);
}

/* ---------- タップで選べるもの ---------- */
function pickEntity(ray) {
  const cands = [];
  const test = (ent, kind) => {
    const pos = ent.m.root.position;
    const c = new THREE.Vector3(pos.x, pos.y + 0.8, pos.z);
    const d = ray.ray.distanceToPoint(c);
    const rr = kind === 'animal' ? Math.max(1, SPECIES[ent.a.sp].reach * 0.55) : 1.1;
    if (d < rr) cands.push({ ent, kind, dist: ray.ray.origin.distanceTo(c) });
  };
  ACT.animals.forEach((e) => test(e, 'animal'));
  ACT.npcs.forEach((e) => test(e, 'npc'));
  ACT.wild.forEach((e) => { if (e.m.root.visible) test(e, 'wild'); });
  cands.sort((a, b) => a.dist - b.dist);
  if (cands[0]) return cands[0];
  // ベンチ
  for (const bn of (W.benches || [])) { const h = ray.intersectObject(bn.model, true)[0]; if (h) return { ent: benchEnt(bn), kind: 'bench', dist: h.distance }; }
  // 行事の飾り（ツリー、笹飾り、記念日の黒板）
  for (const it of (W.eventItems || [])) { const h = ray.intersectObject(it.model, true)[0]; if (h) return { ent: evItemEnt(it), kind: 'evitem', dist: h.distance }; }
  // 置いた物（エンリッチメントや飾り）
  let best = null;
  for (const sid in (W.placedModels || {})) {
    const e = itemEnt(sid); if (!e) continue;
    const h = ray.intersectObject(e.m.root, true)[0]; if (h && (!best || h.distance < best.dist)) best = { ent: e, kind: 'item', dist: h.distance };
  }
  return best;
}
// 置いた物を、近づいたり押したりできる相手として扱う（ベンチは座る方で）
function itemEnt(sid) {
  const id = G.placed[sid], it = ITEMS[id], root = W.placedModels && W.placedModels[sid];
  if (!id || !it || !root || id === 'bench') return null;
  const s = SLOTS.find((q) => q.id === sid); if (!s) return null;
  return { x: s.x, z: s.z, name: it.name, sid, id, item: it, m: { root } };
}
function evItemEnt(it) { return { x: it.x, z: it.z, name: it.name, ev: it.id, m: { root: it.model } }; }
function benchEnt(bn) { return { x: bn.x, z: bn.z, name: bn.seatName || 'ベンチ', seatName: bn.seatName, bench: bn, m: { root: bn.model } }; }
function nearestInteractable() {
  const P = ACT.player; let best = null, bd = 1e9;
  const test = (e, kind, reach) => { if (e.m.root.visible === false) return; const d = Math.hypot(e.x - P.x, e.z - P.z); if (d < reach && d < bd) { bd = d; best = { ent: e, kind }; } };
  ACT.animals.forEach((e) => test(e, 'animal', SPECIES[e.a.sp].reach + 0.8));
  ACT.npcs.forEach((e) => test(e, 'npc', 3));
  ACT.wild.forEach((e) => test(e, 'wild', 7));
  for (const bn of (W.benches || [])) { const d = Math.hypot(bn.x - P.x, bn.z - P.z) - 0.6; if (d < 1.8 && d < bd) { bd = d; best = { ent: benchEnt(bn), kind: 'bench' }; } }
  for (const sid in (W.placedModels || {})) { const e = itemEnt(sid); if (!e) continue; const d = Math.hypot(e.x - P.x, e.z - P.z) - 0.7; if (d < 1.9 && d < bd) { bd = d; best = { ent: e, kind: 'item' }; } }
  for (const it of (W.eventItems || [])) { const d = Math.hypot(it.x - P.x, it.z - P.z) - 0.9; if (d < 1.9 && d < bd) { bd = d; best = { ent: evItemEnt(it), kind: 'evitem' }; } }

}

/* ---------- 日付 ---------- */
function isoOf(d) { const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function dateOf(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }

  if (eo && eo !== 'auto' && eo !== 'none') { const e = EVENTS.find((x) => x.id === eo); if (e) return e.to.slice(); }
  if (so && so !== 'auto' && G && so !== seasonOf(G.date)) return SEASON_DAY[so].slice();

}
const mdv = (md) => md[0] * 100 + md[1];

}

// これから決まっていることを入れて、この先 n か月の見通し

  const f = finance(), events = [];
  for (const h of G.hiring) events.push({ turn: h.done, label: `${h.name}（${h.kind === 'staff' ? '職員' : 'アルバイト'}）が来る`, dInc: 0, dCost: salary(h.kind) });

  pageHtml(p, filter, evening) {
    if (!p) return '<p class="muted">まだ日記はありません。</p>';
    const byCat = {};
    for (const e of p.entries) { if (e.cat === 'gauge' && !G.settings.gauge) continue; (byCat[e.cat] = byCat[e.cat] || []).push(e); }
    let h = `<div class="page"><span class="stamp">第${p.turn}週</span><p class="pdate">${fmtDate(p.date, true)}</p><p class="pmeta">${(p.wx && p.wx.length > 1 ? p.wx : [p.weather]).map((k) => WEATHER_NAME[k] || '').join('のち')}・${SEASON_NAME[p.season] || ''}・${STAGES[p.stage] ? STAGES[p.stage].name : ''}${p.events && p.events.length ? '・' + p.events.map((id) => (EVENTS.find((e) => e.id === id) || {}).name).join('、') : ''}</p>`;
    // 表紙：その週の写真から1枚（自分で選んだ写真、なければいちばん良さそうな1枚）
    const cv = (!filter || filter === 'photo') ? coverPhoto(p.turn) : null;
    if (cv && cv.thumb) h += `<figure class="cover"><img src="${cv.url}" alt="${esc(cv.caption || '今週の一枚')}"><figcaption>${esc(cv.caption || '今週の一枚')}<small>今週の一枚</small></figcaption></figure>`;
    else if (cv) h += `<figure class="cover"><button data-act="photo-view" data-id="${cv.id}" aria-label="表紙の写真を大きく見る"><img src="${cv.url}" alt="${esc(cv.caption || '今週の一枚')}"></button><figcaption>${esc(cv.caption || '今週の一枚')}<small>今週の一枚${weekPhotos(p.turn).length > 1 ? '　写真を押すと、表紙を選べます' : ''}</small></figcaption></figure>`;

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    case 's_summer': drLeaf(g, u * 6, B + u * 2, u * 7, -0.6, '#8CCB6A', '#3E7A34'); drLeaf(g, u * 15, B + u * 3, u * 6, 0.5, '#8CCB6A', '#3E7A34'); drAsagao(g, u * 9, B - u * 3, u * 5, '#5A6FD0'); drAsagao(g, u * 18, B, u * 3.6, '#B060B8'); for (let k = 0; k < 14; k++) { g.fillStyle = `rgba(240,255,170,${0.55 + hash2(k, 3) * 0.4})`; g.beginPath(); g.arc(w * (0.5 + hash2(k, 1) * 0.45), h * (0.08 + hash2(k, 4) * 0.2), u * (0.35 + hash2(k, 7) * 0.3), 0, 7); g.fill(); } break;

    case 's_winter': drLeaf(g, w - u * 15, B + u * 3, u * 6, -0.9, '#5E9A5A', '#2A5A30'); drLeaf(g, w - u * 5, B + u * 2, u * 6, 0.8, '#5E9A5A', '#2A5A30'); drCamellia(g, w - u * 10, B - u * 2, u * 4.6); drCamellia(g, w - u * 18, B + u * 1, u * 3.2); for (let k = 0; k < 9; k++) drSnow(g, w * (0.08 + hash2(k, 1) * 0.84), h * (0.08 + hash2(k, 2) * 0.35), u * (1.2 + hash2(k, 3) * 1.4)); break;
    default: drHeart(g, w / 2, h - u * 5, u * 3, acc);
  }
}


/* =========================================================
   起動とループ
   ========================================================= */
let STARTED = false;
// テスト版：最近のエラーを覚えておき、ご意見と一緒に送れるように
const ERRLOG = [];
window.addEventListener('error', (e) => { ERRLOG.push({ t: new Date().toISOString(), m: String((e && e.message) || e).slice(0, 200), at: e && e.filename ? `${String(e.filename).split('/').pop()}:${e.lineno}` : '' }); if (ERRLOG.length > 10) ERRLOG.shift(); });
// 画面の中で受けとめたエラーも、ご意見と一緒に送れるように残す
function logErr(err, where) { ERRLOG.push({ t: new Date().toISOString(), m: String((err && err.message) || err).slice(0, 200), at: where || '' }); if (ERRLOG.length > 10) ERRLOG.shift(); try { console.error(err); } catch (e) { /* なし */ } }
window.addEventListener('unhandledrejection', (e) => { const r = e && e.reason; ERRLOG.push({ t: new Date().toISOString(), m: String((r && (r.message || r.code)) || r).slice(0, 200), at: 'promise' }); if (ERRLOG.length > 10) ERRLOG.shift(); });
// かるい表示：画素を減らし、影を消す
function applyLite() {
  const lite = !!(G && G.settings && G.settings.lite);
  R.renderer.setPixelRatio(lite ? 1 : Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.6 : 2));
  R.sun.castShadow = !lite;
  resize();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  R.renderer.setSize(w, h, false);
  R.camera.aspect = w / h; R.camera.updateProjectionMatrix();
  if (CAM.shiftPx) camShift(CAM.shiftPx);
  if (CAM.overview) CAM.tDist = overviewDist();
}
function beginPlay() {
  UI._gN = undefined; UI._gSig = null;
  STARTED = true;
  $('#start').hidden = true; $('#hud').hidden = false;
  ACT.player.m.root.visible = true;
  CAM.spin = false; CAM.overview = false; CAM.lock = false;
  camHome(ACT.player.heading + Math.PI);
  UI.refresh();
}
function backdrop() {
  G = newState('hakoniwa'); setupHakoniwa(); G._backdrop = true; // はじめの画面の後ろの景色。保存しない
  G.settings.seasonOverride = 'auto'; G.settings.eventOverride = 'auto';
  applyCalendar(); G.weather = G.season === 'winter' ? 'snow' : 'sunny'; WS.weather = G.weather;
  buildWorld(); syncNPCs(); syncAnimals(); syncWild();
  teleportPlayer(0, 46); ACT.player.m.root.visible = false;
  setOverview(true); CAM.spin = true; CAM.dist = CAM.tDist; CAM.pitch = CAM.tPitch = 0.62; CAM.target.set(0, 0, 2);
  SKY.t = 0.4; SKY.target = 0.4; SKY.rbT = 0; skySnapWeather();
}
/* はじめの画面：育てている続き（保存あり）と、箱庭モード（保存なし。毎回すべてがそろった姿から） */
const START = { normal: null };
function showStart() {
  const n = START.normal && START.normal.o;
  const bc = $('#start-continue'), bn = $('#start-normal');
  bc.hidden = !n;
  if (n) $('#continue-sub').textContent = `${STAGES[n.stage].name}・${fmtDate(n.date, true)}・第${n.turn}週`;
  // 強い色は、ひとつだけ：続きがあれば「つづきから」、なければ「はじめから」
  bc.classList.toggle('primary', !!n); bn.classList.toggle('primary', !n);
  const note = $('#start-note');
  note.hidden = !n;
  note.textContent = `育てている続きは、${STORE.ok ? 'claude.aiのあなたのアカウント' : 'このブラウザ'}に保存しています。箱庭モードは保存せず、毎回すべてがそろった姿から始まります。`;
  $('#start-confirm').hidden = true; $('#start-import-confirm').hidden = true;
  if (n && n.avatar) UI.pendingAvatar = n.avatar;
}
function refreshStart() { START.normal = GAME.latestSave('normal'); showStart(); }
function backToTitle(cleared) {
  if (!cleared) { GAME.save(); cloudFlushNow(); }
  if (UI.rest) UI.abortRest();
  if (!$('#photo-ui').hidden) UI.closePhoto();
  UI.closeSheet(); UI.closeModal(); UI.endPlace();
  STARTED = false; $('#hud').hidden = true; $('#start').hidden = false;
  refreshStart();
  backdrop();
}
function bootWith(data) {
  // はじめの画面のボタンは、どの起動のしかたでも先につないでおく（あとで「はじめの画面に戻る」ため）
  const startNormal = () => { $('#start-confirm').hidden = true; $('#start-import-confirm').hidden = true; audioInit(); beginPlay(); GAME.newGame('normal'); askPersist(); };
  $('#start-normal').addEventListener('click', () => {
    const n = START.normal && START.normal.o;
    if (!n) { startNormal(); return; }
    // 育てている続きがある時は、置き換わることを先に伝える
    $('#start-confirm-text').textContent = `いま育てている続き（${STAGES[n.stage].name}・第${n.turn}週）は消えて、はじめからになります。`;
    $('#start-import-confirm').hidden = true; $('#start-confirm').hidden = false;
  });
  $('#start-confirm-yes').addEventListener('click', startNormal);
  $('#start-confirm-no').addEventListener('click', () => { $('#start-confirm').hidden = true; });
  $('#start-hako').addEventListener('click', () => { $('#start-confirm').hidden = true; $('#start-import-confirm').hidden = true; audioInit(); beginPlay(); GAME.newGame('hakoniwa'); });
  // ファイルから続きを読み込む（新しい端末や、ブラウザのデータを消したあとに）
  $('#start-import').addEventListener('click', () => UI.pickSaveFile('title'));
  $('#save-file').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; UI.onSaveFile(f); });
  $('#start-import-no').addEventListener('click', () => { UI.importPending = null; showStart(); });
  $('#start-import-yes').addEventListener('click', () => {
    const o0 = UI.importPending; if (!o0) return;
    UI.importPending = null; $('#start-import-confirm').hidden = true; $('#start-confirm').hidden = true;
    const o = importSave(o0);
    audioInit(); beginPlay(); GAME.loadGame(o); GAME.save(); askPersist();
  });
  $('#start-continue').addEventListener('click', () => {
    const n = START.normal && START.normal.o; if (!n) return;
    $('#start-confirm').hidden = true; audioInit(); beginPlay(); GAME.loadGame(n); askPersist();
  });
  catalogInit();
  // ページが更新された時は、遊んでいた所から（写真はこの端末の保存から戻す）
  if (data && data.save && data.started) {
    try {
      const o = JSON.parse(data.save), saved = GAME.hasSave(slotOf(o.mode));
      if (saved && saved.photos && saved.photos.length && !(o.photos || []).length) o.photos = saved.photos;
      if (saved && saved.coverThumbs && !Object.keys(o.coverThumbs || {}).length) o.coverThumbs = saved.coverThumbs;
      GAME.loadGame(o); beginPlay(); $('#loading').classList.add('gone'); storeInit(); return;
    } catch (e) { /* 通常の起動へ */ }
  }
  backdrop();
  $('#loading').classList.add('gone');
  try { GAME.hasSave('normal'); localStorage.removeItem(SAVE_KEYS.hako); } catch (e) { /* 前の版の、箱庭モードの保存は使わない */ }
  refreshStart();
  // claude.ai に保存した続きがあれば、それぞれ新しい方を使う（どの端末でも続きから）
  storeInit().then(() => { if (!STARTED) refreshStart(); });
}

(function boot() {
  initGeos();
  const canvas = $('#gl');
  initRenderer(canvas);
  initTerrain(); initSky(); initParticles(); initWorld(); initActors();
  createPlayer(); initTrain();
  window.addEventListener('pointerdown', () => { if (STARTED && G && G.settings.sound) audioInit(); }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && STARTED) cloudFlushNow(); if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend().catch(() => {}); else if (G && G.settings.sound) AU.ctx.resume().catch(() => {}); });
  window.addEventListener('pagehide', () => { if (STARTED) { GAME.save(); cloudFlushNow(); } });
  UI.init();
  initInput(canvas, (x, y) => { if (STARTED) UI.tap(x, y); });
  resize(); window.addEventListener('resize', resize);

  let last = performance.now(), time = 0;
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; time += dt;
    if (G) {
      if (STARTED) updatePlayer(dt);
      updateAnimals(dt, time); updatePeople(dt); updateDoors(dt); updateWild(dt, time); updateLittleLife(dt, time); updateTrain(dt);
      if (STARTED) audioUpdate(dt);
      clockTick(dt); // 時間と天気が、ゆっくり流れる
      updateCamera(dt, ACT.player.m.root.position);
      applySky(dt, $('#app'));
      updateParticles(dt, CAM.target, time);
      updateFX(dt);
      NM.water.opacity = (WS.snow ? 0.97 : 0.86) + Math.sin(time * 1.3) * 0.03;
      UI.frame(dt);
    }
    renderMain();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  const av = $('#app-ver'); if (av) av.textContent = `${APP.label} ${APP.version}（${APP.date}）`;
  const eb = $('#start-eyebrow'); if (eb) eb.textContent = `${APP.label} ${APP.version}`;
  const fontWait = document.fonts && document.fonts.load
    ? Promise.race([Promise.all([document.fonts.load("600 24px 'Klee One'", 'はるにれの丘'), document.fonts.load("700 24px 'Zen Maru Gothic'", 'はるにれの丘')]), new Promise((r) => setTimeout(r, 2500))])
    : Promise.resolve();
  fontWait.catch(() => {}).then(() => {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ save: G && STARTED ? JSON.stringify(Object.assign({}, G, { photos: [], coverThumbs: {} })) : null, started: STARTED })); } catch (e) { /* なし */ } }
    if (hot && typeof hot.ready === 'function') { try { hot.ready((d) => bootWith(d || {})); } catch (e) { bootWith({}); } }
    else bootWith((hot && hot.data) || {});
  });
})();

})();
